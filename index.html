
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アシストケア 出退室管理</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 25px 16px;
      font-family: sans-serif;
      background: #f1f5f2;
      color: #26342b;
    }
    .container { max-width: 440px; margin: 30px auto; }
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-size: 25px; }
    .card {
      background: white;
      border-radius: 18px;
      padding: 25px 20px;
      box-shadow: 0 4px 18px #0000000c;
      text-align: center;
    }
    .icon { font-size: 48px; }
    .description {
      font-size: 14px;
      color: #718078;
      line-height: 1.7;
    }
    button {
      width: 100%;
      padding: 18px;
      margin-top: 25px;
      border: none;
      border-radius: 12px;
      background: #06c755;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }
    button:disabled { opacity: .5; }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f1f5f2;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .footer {
      text-align: center;
      color: #8a958e;
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>アシストケア</h1>
      <p>職員出退室管理システム</p>
    </div>

    <div class="card">
      <div class="icon">📍</div>
      <h2>出退室管理</h2>

      <p class="description" id="description">
        LINEを確認しています。
      </p>

      <button id="scanButton" type="button" disabled onclick="scanQR()">
        QRコードを読み取る
      </button>

      <div class="status" id="status">
        LINE接続を確認しています...
      </div>
    </div>

    <div class="footer">
      株式会社アシストケア
    </div>
  </div>

<script>
const LIFF_ID = '2012373373-XMS76enQ';

async function initialize() {
  const status = document.getElementById('status');
  const button = document.getElementById('scanButton');

  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isInClient()) {
      status.textContent = 'LINEアプリ内から開いてください。';
      return;
    }

    const profile = await liff.getProfile();

    document.getElementById('description').textContent =
      'ログイン中：' + profile.displayName;

    status.textContent =
      'LINE接続成功！\nQRコードを読み取る準備ができました。';

    button.disabled = false;

  } catch (error) {
    status.textContent =
      'LINE接続エラー：' + error.message;
  }
}

async function scanQR() {
  const status = document.getElementById('status');
  const button = document.getElementById('scanButton');

  try {
    button.disabled = true;
    status.textContent = 'QRコード読み取りを起動しています...';

    if (typeof liff.scanCodeV2 !== 'function') {
      throw new Error(
        'QR読み取り機能が利用できません。LINE DevelopersのScan QR設定を確認してください。'
      );
    }

    const result = await liff.scanCodeV2();
    const qrCode = result.value.trim();

    if (!qrCode) {
      throw new Error('QRコードを読み取れませんでした。');
    }

    status.textContent =
      'QRコード読み取り成功！\n\n' +
      '読み取った内容：\n' + qrCode +
      '\n\n次は出退室記録を接続します。';

  } catch (error) {
    status.textContent =
      '読み取りエラー：' + error.message;
  } finally {
    button.disabled = false;
  }
}

initialize();
</script>
</body>
</html>
