
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アシストケア 出退室管理</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px 16px;
      font-family: sans-serif;
      background: #f1f5f2;
      color: #26342b;
    }

    .container {
      max-width: 440px;
      margin: 30px auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 { font-size: 25px; }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px 20px;
      box-shadow: 0 4px 18px #0000000c;
      text-align: center;
    }

    .icon { font-size: 48px; }

    .description {
      font-size: 14px;
      color: #718078;
      line-height: 1.7;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    button:disabled { opacity: .5; }

    .scan-button { background: #06c755; }
    .entry-button { background: #16834a; }
    .exit-button { background: #2563a8; }
    .again-button { background: #68756d; font-size: 15px; }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f1f5f2;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .location {
      margin: 15px 0;
      padding: 15px;
      background: #edf7ef;
      border-radius: 12px;
      font-weight: bold;
    }

    .choice-area, .result-area { margin-top: 20px; }

    .footer {
      text-align: center;
      color: #8a958e;
      font-size: 12px;
      margin-top: 22px;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>
<div class="container">

  <div class="header">
    <h1>アシストケア</h1>
    <p>職員出退室管理システム</p>
  </div>

  <div class="card">

    <div class="icon">📍</div>
    <h2>出退室管理</h2>

    <p class="description" id="description">
      LINEを確認しています。
    </p>

    <button
      id="scanButton"
      class="scan-button"
      type="button"
      disabled
      onclick="scanQR()">
      QRコードを読み取る
    </button>

    <div id="choiceArea" class="choice-area" hidden>

      <div class="location" id="locationName">
        📍 訪問先を確認しています。
      </div>

      <h3>入室・退室を選んでください</h3>

      <button
        class="entry-button"
        type="button"
        onclick="selectType('入室')">
        入室
      </button>

      <button
        class="exit-button"
        type="button"
        onclick="selectType('退室')">
        退室
      </button>

    </div>

    <div id="resultArea" class="result-area" hidden>
      <div class="status" id="resultText"></div>

      <button
        class="again-button"
        type="button"
        onclick="resetScreen()">
        最初に戻る
      </button>
    </div>

    <div class="status" id="status">
      LINE接続を確認しています...
    </div>

  </div>

  <div class="footer">
    株式会社アシストケア
  </div>

</div>

<script>

/**************************************************
 * 基本設定
 **************************************************/

const LIFF_ID = '2012373373-XMS76enQ';

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbz5pFWAWGmL0If9IknUwMJqQPPuYFW-pylgH40caL30JTxgNBkcaeTUQFpztttKOuomMQ/exec';

let currentProfile = null;
let currentQR = null;
let currentLocation = null;
let processing = false;


/**************************************************
 * 共通処理
 **************************************************/

function showStatus(message) {
  document.getElementById('status').textContent = message;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function createRequestId() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(
    /[xy]/g,
    function(c) {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 3 | 8);
      return v.toString(16);
    }
  );
}


/**************************************************
 * LINE初期設定
 **************************************************/

async function initialize() {

  const button = document.getElementById('scanButton');

  try {

    showStatus('LINEに接続しています...');

    await liff.init({ liffId: LIFF_ID });

    if (!liff.isInClient()) {
      showStatus('LINEアプリ内から開いてください。');
      return;
    }

    currentProfile = await liff.getProfile();

    if (!liff.getIDToken()) {
      throw new Error('LINE本人確認情報がありません。');
    }

    document.getElementById('description').textContent =
      'ログイン中：' + currentProfile.displayName;

    showStatus(
      'LINE接続成功！\nQRコードを読み取ってください。'
    );

    button.disabled = false;

  } catch (error) {

    showStatus('LINE接続エラー：' + error.message);

  }
}


/**************************************************
 * 訪問先QR情報をGASから取得
 **************************************************/

function getQrInfo(qrCode) {

  return new Promise((resolve, reject) => {

    const script = document.createElement('script');

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('訪問先情報の確認がタイムアウトしました。'));
    }, 10000);

    function cleanup() {
      clearTimeout(timer);
      script.remove();
      delete window.assistcareQrCallback;
    }

    window.assistcareQrCallback = function(result) {
      cleanup();
      resolve(result);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error('訪問先情報を取得できません。GASとの接続を確認してください。'));
    };

    script.src =
      GAS_URL +
      '?action=qrInfo' +
      '&qrCode=' + encodeURIComponent(qrCode) +
      '&callback=window.assistcareQrCallback' +
      '&v=' + Date.now();

    document.head.appendChild(script);

  });

}


/**************************************************
 * QRコード読み取り
 **************************************************/

async function scanQR() {

  const button = document.getElementById('scanButton');

  try {

    button.disabled = true;

    showStatus('QRコードを読み取っています...');

    if (typeof liff.scanCodeV2 !== 'function') {
      throw new Error('QR読み取り機能が利用できません。');
    }

    const result = await liff.scanCodeV2();

    const qrCode = String(result.value || '').trim();

    if (!qrCode) {
      throw new Error('QRコードの内容が空です。');
    }

    showStatus('訪問先情報を確認しています...');

    // GASのQRマスタと照合
    const qrInfo = await getQrInfo(qrCode);

    if (!qrInfo || qrInfo.valid !== true) {
      throw new Error(
        qrInfo && qrInfo.message
          ? qrInfo.message
          : '登録されていないQRコードです。'
      );
    }

    currentQR = qrInfo.qrCode;
    currentLocation = qrInfo.locationName;

    // 読み取った訪問先名を表示
    document.getElementById('locationName').textContent =
      '📍 訪問先：' + currentLocation;

    button.hidden = true;

    document.getElementById('choiceArea').hidden = false;

    showStatus(
      'QRコード確認成功！\n' +
      '訪問先：' + currentLocation +
      '\n入室・退室を選択してください。'
    );

  } catch (error) {

    showStatus('読み取りエラー：' + error.message);

    button.disabled = false;

  }

}


/**************************************************
 * GPS取得
 **************************************************/

function getGPS() {

  return new Promise((resolve, reject) => {

    if (!navigator.geolocation) {
      reject(new Error('位置情報に対応していません。'));
      return;
    }

    navigator.geolocation.getCurrentPosition(

      resolve,

      error => {

        const messages = {
          1: '位置情報の利用が許可されていません。',
          2: '現在地を取得できませんでした。',
          3: '位置情報の取得がタイムアウトしました。'
        };

        reject(
          new Error(messages[error.code] || error.message)
        );

      },

      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }

    );

  });

}


/**************************************************
 * GAS記録状況確認
 **************************************************/

function getSaveStatus(requestId) {

  return new Promise((resolve, reject) => {

    const script = document.createElement('script');

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('記録結果の確認に失敗しました。'));
    }, 10000);

    function cleanup() {
      clearTimeout(timer);
      script.remove();
      delete window.assistcareStatusCallback;
    }

    window.assistcareStatusCallback = function(result) {
      cleanup();
      resolve(result);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error('GASとの接続を確認できません。'));
    };

    script.src =
      GAS_URL +
      '?action=status' +
      '&requestId=' + encodeURIComponent(requestId) +
      '&callback=window.assistcareStatusCallback' +
      '&v=' + Date.now();

    document.head.appendChild(script);

  });

}


async function waitForSave(requestId) {

  const deadline = Date.now() + 30000;

  while (Date.now() < deadline) {

    const result = await getSaveStatus(requestId);

    if (
      result.state === 'success' ||
      result.state === 'error'
    ) {
      return result;
    }

    await sleep(1500);

  }

  throw new Error(
    '記録結果を確認できませんでした。管理者に確認してください。'
  );

}


/**************************************************
 * GASへ出退室情報を送信
 **************************************************/

async function sendAttendance(type, position) {

  const idToken = liff.getIDToken();

  if (!idToken) {
    throw new Error('LINE本人確認情報を取得できません。');
  }

  const requestId = createRequestId();

  const form = new URLSearchParams();

  form.set('requestId', requestId);
  form.set('idToken', idToken);
  form.set('qrCode', currentQR);
  form.set('type', type);
  form.set('latitude', String(position.coords.latitude));
  form.set('longitude', String(position.coords.longitude));

  showStatus('スプレッドシートへ送信しています...');

  try {

    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: form
    });

  } catch (sendError) {
    // 下の保存状況確認で判定
  }

  const saved = await waitForSave(requestId);

  if (saved.state !== 'success') {
    throw new Error(saved.message || '記録に失敗しました。');
  }

  return saved.message;

}


/**************************************************
 * LINEトークへ打刻通知
 **************************************************/

async function sendLineNotification(message) {

  if (!liff.isInClient()) {
    throw new Error('LINEアプリ内から開いてください。');
  }

  const context = liff.getContext();

  if (!context || context.type !== 'utou') {
    throw new Error(
      '会社のLINE公式アカウントとの1対1トークから開き直してください。'
    );
  }

  const permission =
    await liff.permission.query('chat_message.write');

  if (permission.state !== 'granted') {
    throw new Error(
      'LINEメッセージ送信の許可が確認できません。'
    );
  }

  await liff.sendMessages([
    {
      type: 'text',
      text: message
    }
  ]);

}


/**************************************************
 * 入室・退室処理
 **************************************************/

async function selectType(type) {

  if (processing) return;

  processing = true;

  const resultArea = document.getElementById('resultArea');
  const resultText = document.getElementById('resultText');

  document.getElementById('choiceArea').hidden = true;
  resultArea.hidden = false;

  try {

    resultText.textContent =
      '位置情報を取得しています...\n画面を閉じずにお待ちください。';

    const position = await getGPS();

    // GASへ保存
    const savedMessage =
      await sendAttendance(type, position);

    resultText.textContent =
      '✅ スプレッドシートへの保存が完了しました！\n\n' +
      savedMessage +
      '\n\nLINE通知を送信しています...';

    // LINEトークへ送信
    try {

      await sendLineNotification(savedMessage);

      resultText.textContent =
        '✅ 出退室記録が完了しました！\n\n' +
        savedMessage +
        '\n\n✅ LINEトークへの送信も完了しました。';

    } catch (notificationError) {

      resultText.textContent =
        '✅ 出退室記録は保存済みです。\n\n' +
        savedMessage +
        '\n\n⚠️ LINE通知は送信できませんでした。\n' +
        notificationError.message;

    }

  } catch (error) {

    resultText.textContent =
      '❌ 記録できませんでした。\n\n' +
      error.message +
      '\n\n管理者に確認してください。';

  }

}


/**************************************************
 * 最初の画面に戻る
 **************************************************/

function resetScreen() {

  processing = false;

  currentQR = null;
  currentLocation = null;

  document.getElementById('resultArea').hidden = true;
  document.getElementById('choiceArea').hidden = true;

  const button = document.getElementById('scanButton');

  button.hidden = false;
  button.disabled = false;

  showStatus('QRコードを読み取ってください。');

}


/**************************************************
 * 起動
 **************************************************/

initialize();

</script>

</body>
</html>
