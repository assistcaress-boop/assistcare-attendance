
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アシストケア 出退室管理</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px 16px;
      font-family: sans-serif;
      background: #f1f5f2;
      color: #26342b;
    }

    .container {
      max-width: 440px;
      margin: 30px auto;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 { font-size: 25px; }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px 20px;
      box-shadow: 0 4px 18px #0000000c;
      text-align: center;
    }

    .icon { font-size: 48px; }

    .description {
      font-size: 14px;
      color: #718078;
      line-height: 1.7;
    }

    button {
      width: 100%;
      padding: 17px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled { opacity: .5; }

    input {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 1px solid #ccd5cf;
      border-radius: 10px;
      font-size: 16px;
    }

    .scan-button { background: #06c755; }
    .entry-button { background: #16834a; }
    .exit-button { background: #2563a8; }
    .again-button { background: #68756d; }
    .register-button { background: #16834a; }

    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #f1f5f2;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      text-align: left;
    }

    .location {
      margin: 15px 0;
      padding: 15px;
      background: #edf7ef;
      border-radius: 12px;
      font-weight: bold;
    }

    .choice-area, .result-area { margin-top: 20px; }

    .registration-area {
      margin-top: 20px;
      padding: 18px;
      background: #edf7ef;
      border-radius: 12px;
      text-align: left;
    }

    .registration-area h3 {
      text-align: center;
      margin-top: 0;
    }

    .registration-area p {
      font-size: 13px;
      line-height: 1.7;
      color: #53615a;
    }

    .footer {
      text-align: center;
      color: #8a958e;
      font-size: 12px;
      margin-top: 22px;
    }

    [hidden] { display: none !important; }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>アシストケア</h1>
    <p>職員出退室管理システム</p>
  </div>

  <div class="card">

    <div class="icon">📍</div>
    <h2>出退室管理</h2>

    <p class="description" id="description">
      LINEを確認しています。
    </p>

    <!-- 初回職員登録 -->
    <div id="registrationArea"
         class="registration-area"
         hidden>

      <h3>職員の初回登録</h3>

      <p>
        初めて利用する場合は、会社から配布された職員登録コードを入力してください。
        登録後は次回からコード入力は不要です。
      </p>

      <input
        type="password"
        id="registrationCode"
        placeholder="職員登録コード"
        autocomplete="off">

      <button
        id="registerButton"
        class="register-button"
        type="button"
        onclick="registerStaff()">
        職員登録する
      </button>

    </div>

    <!-- QR読み取り -->
    <button
      id="scanButton"
      class="scan-button"
      type="button"
      disabled
      hidden
      onclick="scanQR()">
      QRコードを読み取る
    </button>

    <!-- 入室・退室 -->
    <div id="choiceArea" class="choice-area" hidden>

      <div class="location" id="locationName">
        📍 訪問先を確認しています。
      </div>

      <h3>入室・退室を選んでください</h3>

      <button
        class="entry-button"
        type="button"
        onclick="selectType('入室')">
        入室
      </button>

      <button
        class="exit-button"
        type="button"
        onclick="selectType('退室')">
        退室
      </button>

    </div>

    <!-- 結果 -->
    <div id="resultArea" class="result-area" hidden>

      <div class="status" id="resultText"></div>

      <button
        class="again-button"
        type="button"
        onclick="resetScreen()">
        最初に戻る
      </button>

    </div>

    <div class="status" id="status">
      LINE接続を確認しています...
    </div>

  </div>

  <div class="footer">
    株式会社アシストケア
  </div>

</div>

<script>

/**************************************************
 * 基本設定
 **************************************************/

const LIFF_ID = '2012373373-XMS76enQ';

const GAS_URL =
  'https://script.google.com/macros/s/AKfycbz5pFWAWGmL0If9IknUwMJqQPPuYFW-pylgH40caL30JTxgNBkcaeTUQFpztttKOuomMQ/exec';

let currentProfile = null;
let currentQR = null;
let currentLocation = null;
let processing = false;
let staffAuthorized = false;


/**************************************************
 * 共通処理
 **************************************************/

function showStatus(message) {
  document.getElementById('status').textContent = message;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function createRequestId() {

  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(
    /[xy]/g,
    function(c) {

      const r = Math.random() * 16 | 0;

      const v = c === 'x' ? r : (r & 3 | 8);

      return v.toString(16);

    }
  );

}


/**************************************************
 * GAS処理結果取得
 **************************************************/

function getRequestStatus(requestId) {

  return new Promise((resolve, reject) => {

    const script = document.createElement('script');

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('GASの処理結果を取得できません。'));
    }, 10000);

    function cleanup() {
      clearTimeout(timer);
      script.remove();
      delete window.assistcareStatusCallback;
    }

    window.assistcareStatusCallback = function(result) {
      cleanup();
      resolve(result);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error('GASとの通信に失敗しました。'));
    };

    script.src =
      GAS_URL +
      '?action=status' +
      '&requestId=' + encodeURIComponent(requestId) +
      '&callback=window.assistcareStatusCallback' +
      '&v=' + Date.now();

    document.head.appendChild(script);

  });

}


async function waitForRequest(requestId) {

  const deadline = Date.now() + 30000;

  while (Date.now() < deadline) {

    const result = await getRequestStatus(requestId);

    if (result.state === 'success') {
      return result.data;
    }

    if (result.state === 'error') {
      throw new Error(result.message);
    }

    await sleep(1200);

  }

  throw new Error(
    '処理結果を確認できませんでした。再操作前に管理者へ確認してください。'
  );

}


/**************************************************
 * GASへ安全にPOST
 **************************************************/

async function callGas(action, values) {

  const requestId = createRequestId();

  const form = new URLSearchParams();

  form.set('action', action);
  form.set('requestId', requestId);

  Object.keys(values).forEach(function(key) {
    form.set(key, String(values[key] ?? ''));
  });

  try {

    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: form
    });

  } catch (error) {

    // 送信結果はサーバー側の処理状況で確認する

  }

  return await waitForRequest(requestId);

}


/**************************************************
 * 職員画面を有効にする
 **************************************************/

function activateStaff(staffName) {

  staffAuthorized = true;

  document.getElementById('registrationArea').hidden = true;

  const button = document.getElementById('scanButton');

  button.hidden = false;
  button.disabled = false;

  document.getElementById('description').textContent =
    '登録済み職員：' + staffName;

  showStatus(
    '✅ 職員登録確認済み\nQRコードを読み取ってください。'
  );

}


/**************************************************
 * LINE初期設定・職員登録状況確認
 **************************************************/

async function initialize() {

  try {

    showStatus('LINEに接続しています...');

    await liff.init({
      liffId: LIFF_ID
    });

    if (!liff.isInClient()) {
      throw new Error('LINEアプリ内から開いてください。');
    }

    currentProfile = await liff.getProfile();

    const idToken = liff.getIDToken();

    if (!idToken) {
      throw new Error(
        '本人確認情報を取得できません。openid権限を確認してください。'
      );
    }

    document.getElementById('description').textContent =
      'ログイン中：' + currentProfile.displayName;

    showStatus('職員登録状況を確認しています...');

    const result = await callGas(
      'checkStaff',
      {
        idToken: idToken,
        displayName: currentProfile.displayName
      }
    );

    if (result.status === 'active') {

      // 既存職員は登録コード不要
      activateStaff(
        result.staffName || currentProfile.displayName
      );

      return;
    }

    if (result.status === 'unregistered') {

      document.getElementById('registrationArea').hidden = false;

      showStatus(
        '初回登録が必要です。\n会社から配布された登録コードを入力してください。'
      );

      return;
    }

    if (result.status === 'disabled') {

      throw new Error(
        'このアカウントは利用停止中です。管理者に確認してください。'
      );

    }

    throw new Error('職員登録状況を確認できませんでした。');

  } catch (error) {

    showStatus('利用確認エラー：' + error.message);

  }

}


/**************************************************
 * 初回職員登録
 **************************************************/

async function registerStaff() {

  const button =
    document.getElementById('registerButton');

  const code =
    document.getElementById('registrationCode').value.trim();

  if (!code) {
    showStatus('職員登録コードを入力してください。');
    return;
  }

  button.disabled = true;

  showStatus('職員登録を確認しています...');

  try {

    const result = await callGas(
      'registerStaff',
      {
        idToken: liff.getIDToken(),
        displayName: currentProfile.displayName,
        registrationCode: code
      }
    );

    document.getElementById('registrationCode').value = '';

    activateStaff(
      result.staffName || currentProfile.displayName
    );

    showStatus(
      '✅ 職員登録が完了しました！\n' +
      '次回から登録コードの入力は不要です。\n' +
      'QRコードを読み取ってください。'
    );

  } catch (error) {

    showStatus(
      '職員登録エラー：' + error.message
    );

  } finally {

    button.disabled = false;

  }

}


/**************************************************
 * 訪問先QR情報取得
 **************************************************/

function getQrInfo(qrCode) {

  return new Promise((resolve, reject) => {

    const script = document.createElement('script');

    const timer = setTimeout(() => {
      cleanup();
      reject(new Error('訪問先情報の確認がタイムアウトしました。'));
    }, 10000);

    function cleanup() {
      clearTimeout(timer);
      script.remove();
      delete window.assistcareQrCallback;
    }

    window.assistcareQrCallback = function(result) {
      cleanup();
      resolve(result);
    };

    script.onerror = function() {
      cleanup();
      reject(new Error('訪問先情報を取得できません。'));
    };

    script.src =
      GAS_URL +
      '?action=qrInfo' +
      '&qrCode=' + encodeURIComponent(qrCode) +
      '&callback=window.assistcareQrCallback' +
      '&v=' + Date.now();

    document.head.appendChild(script);

  });

}


/**************************************************
 * QR読み取り
 **************************************************/

async function scanQR() {

  const button = document.getElementById('scanButton');

  if (!staffAuthorized) {
    showStatus('職員登録が完了していません。');
    return;
  }

  try {

    button.disabled = true;

    showStatus('QRコードを読み取っています...');

    if (typeof liff.scanCodeV2 !== 'function') {
      throw new Error('QR読み取り機能が利用できません。');
    }

    const result = await liff.scanCodeV2();

    const qrCode = String(result.value || '').trim();

    if (!qrCode) {
      throw new Error('QRコードの内容が空です。');
    }

    showStatus('訪問先情報を確認しています...');

    const qrInfo = await getQrInfo(qrCode);

    if (!qrInfo || qrInfo.valid !== true) {
      throw new Error(
        qrInfo && qrInfo.message
          ? qrInfo.message
          : '未登録または利用停止中のQRコードです。'
      );
    }

    currentQR = qrInfo.qrCode;
    currentLocation = qrInfo.locationName;

    document.getElementById('locationName').textContent =
      '📍 訪問先：' + currentLocation;

    button.hidden = true;

    document.getElementById('choiceArea').hidden = false;

    showStatus(
      'QRコード確認成功！\n' +
      '訪問先：' + currentLocation +
      '\n入室・退室を選択してください。'
    );

  } catch (error) {

    showStatus(
      'QR読み取りエラー：' + error.message
    );

    button.disabled = false;

  }

}


/**************************************************
 * GPS取得
 **************************************************/

function getGPS() {

  return new Promise((resolve, reject) => {

    if (!navigator.geolocation) {
      reject(new Error('位置情報に対応していません。'));
      return;
    }

    navigator.geolocation.getCurrentPosition(

      resolve,

      error => {

        const messages = {
          1: '位置情報の利用が許可されていません。',
          2: '現在地を取得できませんでした。',
          3: '位置情報の取得がタイムアウトしました。'
        };

        reject(
          new Error(messages[error.code] || error.message)
        );

      },

      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }

    );

  });

}


/**************************************************
 * 出退室記録をGASに送信
 **************************************************/

async function sendAttendance(type, position) {

  const result = await callGas(
    'attendance',
    {
      idToken: liff.getIDToken(),
      displayName: currentProfile.displayName,
      qrCode: currentQR,
      type: type,
      latitude: position.coords.latitude,
      longitude: position.coords.longitude
    }
  );

  return result.message;

}


/**************************************************
 * LINEトークへの通知
 **************************************************/

async function sendLineNotification(message) {

  if (!liff.isInClient()) {
    throw new Error('LINEアプリ内から開いてください。');
  }

  const context = liff.getContext();

  if (!context || context.type !== 'utou') {
    throw new Error(
      '会社の公式アカウントとの1対1トークから開き直してください。'
    );
  }

  const permission =
    await liff.permission.query('chat_message.write');

  if (permission.state !== 'granted') {
    throw new Error(
      'LINEメッセージ送信への許可が確認できません。'
    );
  }

  await liff.sendMessages([
    {
      type: 'text',
      text: message
    }
  ]);

}


/**************************************************
 * 入室・退室処理
 **************************************************/

async function selectType(type) {

  if (processing || !staffAuthorized) return;

  processing = true;

  document.getElementById('choiceArea').hidden = true;

  document.getElementById('resultArea').hidden = false;

  const resultText =
    document.getElementById('resultText');

  try {

    resultText.textContent =
      '位置情報を取得しています...\n画面を閉じずにお待ちください。';

    const position = await getGPS();

    const savedMessage =
      await sendAttendance(type, position);

    resultText.textContent =
      '✅ スプレッドシートへの保存が完了しました！\n\n' +
      savedMessage +
      '\n\nLINE通知を送信しています...';

    try {

      await sendLineNotification(savedMessage);

      resultText.textContent =
        '✅ 出退室記録が完了しました！\n\n' +
        savedMessage +
        '\n\n✅ LINEトークへの送信も完了しました。';

    } catch (notificationError) {

      resultText.textContent =
        '✅ 出退室記録は保存済みです。\n\n' +
        savedMessage +
        '\n\n⚠️ LINE通知は送信できませんでした。\n' +
        notificationError.message;

    }

  } catch (error) {

    resultText.textContent =
      '❌ 記録できませんでした。\n\n' +
      error.message +
      '\n\n管理者に確認してください。';

  }

}


/**************************************************
 * 最初に戻る
 **************************************************/

function resetScreen() {

  processing = false;

  currentQR = null;
  currentLocation = null;

  document.getElementById('resultArea').hidden = true;

  document.getElementById('choiceArea').hidden = true;

  const button =
    document.getElementById('scanButton');

  button.hidden = false;
  button.disabled = false;

  showStatus('QRコードを読み取ってください。');

}


/**************************************************
 * 起動
 **************************************************/

initialize();

</script>

</body>
</html>
